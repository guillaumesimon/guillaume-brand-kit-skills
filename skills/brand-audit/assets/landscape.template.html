<!doctype html>
<html lang="<!--LANG-->">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title><!--TITLE--></title>
<style>
:root{--ink:#16181d;--muted:#666b76;--line:#e3e1dc;--page:#faf9f6;--card:#fff;--keep:#1f6f4a;--break:#b4451f;--risk:#8a6a00;--self:#b4451f}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:56px 28px 96px}
h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 12px;max-width:18ch}
h2{font-size:1.5rem;letter-spacing:-.01em;margin:72px 0 6px;padding-top:20px;border-top:1px solid var(--ink)}
h3{font-size:1rem;margin:28px 0 8px}
p{margin:0 0 12px;max-width:70ch}
.lede{font-size:1.2rem;max-width:60ch}
.muted,.note{color:var(--muted)} .note{font-size:.875rem}
.label{font:600 .72rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin:20px 0 0;font-size:.9rem}
.meta div span{display:block}
.answer{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:36px}
.answer section{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);padding:18px 20px}
.answer ul{margin:10px 0 0;padding-left:18px} .answer li{margin-bottom:6px}
.grid{display:grid;gap:14px;margin-top:16px}
.g-logos{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.g-heroes{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g-lib{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
figure{margin:0;background:var(--card);border:1px solid var(--line)}
figure img{display:block;width:100%;height:auto}
.g-logos figure .box{height:110px;display:flex;align-items:center;justify-content:center;padding:14px;background:#fff}
.g-logos figure img{max-height:82px;width:auto;max-width:100%}
.g-lib figure img{aspect-ratio:4/5;object-fit:cover}
figcaption{padding:8px 10px;font-size:.8rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
figcaption small{color:var(--muted);white-space:nowrap}
.missing{color:var(--muted);font-size:.8rem}
table{border-collapse:collapse;width:100%;margin-top:14px;font-size:.9rem;background:var(--card);border:1px solid var(--line)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .72rem/1.2 ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
.strip{display:flex;height:26px;min-width:160px;border:1px solid var(--line)} .strip i{display:block}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px 36px;margin-top:14px}
.bar{display:grid;grid-template-columns:130px 1fr 54px;gap:8px;align-items:center;font-size:.85rem;margin:3px 0}
.bar b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span{height:10px;background:#d9d6cf} .bar span i{display:block;height:100%;background:var(--ink)}
.bar.conv span i{background:var(--break)} .bar em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.conv-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);padding:16px 20px;margin-top:12px}
.conv-card h3{margin:0 0 4px} .conv-card .count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
.ev{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px} .ev a{display:block;border:1px solid var(--line)} .ev img{display:block;height:84px;width:auto}
.opp{background:var(--card);border:1px solid var(--line);padding:22px 24px;margin-top:16px}
.opp h3{font-size:1.25rem;margin:0 0 8px}
.opp dl{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;margin:14px 0 0;font-size:.92rem} .opp dt{color:var(--muted)} .opp dd{margin:0}
.risk{font:600 .72rem/1 ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border:1px solid currentColor;margin-left:8px;vertical-align:3px}
.map{background:var(--card);border:1px solid var(--line);margin-top:16px;padding:8px} .map svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.82rem;margin-top:10px;color:var(--muted)}
a{color:inherit}
@media (max-width:640px){main{padding:32px 16px 64px}.bar{grid-template-columns:100px 1fr 48px}.opp dl{grid-template-columns:1fr}}
@media print{body{background:#fff}h2{break-after:avoid}.opp,.conv-card,figure{break-inside:avoid}}
</style>
</head>
<body>
<main>
<!--BODY-->
</main>
</body>
</html>
