<!doctype html>
<html lang="<!--LANG-->">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title><!--TITLE--></title>
<style>
/* Black, white and three greys. The only colour on the page comes from the evidence. */
:root{--ink:#0a0a0a;--text:#1d1d1f;--muted:#6e6e73;--faint:#a1a1a6;--line:#e5e5e7;--soft:#f5f5f7;--bg:#fff;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;--max:1200px;--r:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration-color:var(--faint);text-underline-offset:3px}
img{max-width:100%}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
.wrap{max-width:var(--max);margin:0 auto;padding:0 32px}

/* Top bar */
.bar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;height:48px;font-size:12px}
.bar b{font-weight:600;color:var(--ink);white-space:nowrap}
.bar nav{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;color:var(--muted)}
.bar nav::-webkit-scrollbar{display:none}
.bar nav a{text-decoration:none;white-space:nowrap}
.bar nav a:hover{color:var(--ink)}

/* Cover */
.cover{padding:112px 0 72px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
h1{font-size:clamp(40px,7vw,84px);line-height:1.02;letter-spacing:-.035em;font-weight:600;color:var(--ink);margin:20px 0 24px;max-width:15ch}
.deck{font-size:clamp(19px,2.2vw,26px);line-height:1.35;letter-spacing:-.01em;color:var(--muted);max-width:32ch}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-top:64px;border-top:1px solid var(--ink)}
.meta div{padding:14px 16px 0 0;font-size:14px;color:var(--ink)}
.meta span{display:block;font:500 11px/1.6 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 32px;margin-top:56px}
.toc a{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;font-size:14px;color:var(--ink)}
.toc a span{font:500 12px/1.75 var(--mono);color:var(--faint)}
.toc a:hover{color:var(--muted)}

/* Sections: a rail and a column */
section.s{display:grid;grid-template-columns:240px minmax(0,1fr);gap:56px;padding:88px 0;border-top:1px solid var(--line);scroll-margin-top:48px}
.rail{position:sticky;top:80px;align-self:start}
.rail .n{font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--faint)}
.rail h2{font-size:28px;line-height:1.1;letter-spacing:-.022em;font-weight:600;color:var(--ink);margin:14px 0 10px}
.rail p{font-size:13px;line-height:1.5;color:var(--muted);max-width:22ch}
.col{min-width:0}
.col>*+*{margin-top:24px}
.lead{font-size:clamp(20px,2vw,24px);line-height:1.35;letter-spacing:-.012em;color:var(--ink);max-width:36ch;font-weight:500}
.col>p,.prose p{max-width:68ch}
.prose p+p{margin-top:14px}
h3{font-size:19px;line-height:1.25;letter-spacing:-.01em;font-weight:600;color:var(--ink);margin-top:48px!important}
h4{font:500 11px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;line-height:1.5;color:var(--muted);max-width:68ch}
.tag{display:inline-block;font:500 10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 8px;white-space:nowrap;vertical-align:2px}
.tag.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* Takeaway and findings */
.take{border-left:2px solid var(--ink);padding:4px 0 4px 20px;font-size:18px;line-height:1.45;letter-spacing:-.008em;color:var(--ink);max-width:54ch;font-weight:500}
.take h4{margin-bottom:8px}
.findings{list-style:none;padding:0;border-top:1px solid var(--line);max-width:780px}
.findings li{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.5}
.findings .tag{justify-self:start;align-self:start;margin-top:3px}
.findings .ev{margin-top:10px}

/* Evidence thumbnails */
.ev{display:flex;flex-wrap:wrap;gap:8px}
.ev a{display:block;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft)}
.ev img{display:block;height:72px;width:auto}

/* Grids and figures */
.grid{display:grid;gap:12px}
.g6{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g-app{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
figure.f{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
figure.f img{display:block;width:100%;height:auto}
figure.f .box{height:112px;display:flex;align-items:center;justify-content:center;padding:18px;background:var(--bg)}
figure.f .box img{max-height:76px;width:auto;max-width:100%}
figure.f .box.dark{background:var(--ink)}
figure.f .box.icon img{width:72px;height:72px;max-height:none;border-radius:22%}
.mono img{filter:grayscale(1) contrast(1.35)}
figcaption{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink)}
figcaption small{font:500 10px/1.4 var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:right}
.missing{font-size:12px;color:var(--faint)}

/* Tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th{text-align:left;font:500 11px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 16px 10px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:13px 16px 13px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
td:first-child{font-weight:500;color:var(--ink)}
td .sub{display:block;font-weight:400;font-size:12px;color:var(--muted)}

/* Bars: black for a convention, grey otherwise */
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:36px 48px}
.bars h4{margin-bottom:12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:12px;align-items:center;font-size:13px;line-height:1.3;padding:5px 0}
.bar-row b{font-weight:400;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .t{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar-row .t i{display:block;height:100%;background:var(--faint);border-radius:3px}
.bar-row.conv b{font-weight:600}
.bar-row.conv .t i{background:var(--ink)}
.bar-row em{font:400 12px/1 var(--mono);font-style:normal;color:var(--muted);text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:6px;border-radius:3px;background:var(--faint);vertical-align:1px;margin-right:6px}
.legend i.k{background:var(--ink)}

/* Summary: five decisions, one row each */
.decisions{border-top:1px solid var(--ink)}
.decisions section{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
.decisions h3{margin:0!important;font-size:19px}
.decisions h4{margin-top:6px}
.decisions ul{list-style:none;padding:0;margin:0}
.decisions li{font-size:15px;line-height:1.5;padding:0 0 10px 18px;position:relative;color:var(--text);max-width:66ch}
.decisions li::before{content:"";position:absolute;left:0;top:.72em;width:8px;height:1px;background:var(--ink)}
.decisions li:last-child{padding-bottom:0}

/* Brand profiles */
.profile{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.profile+.profile{margin-top:16px}
.profile header{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:20px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.profile header .lg{height:44px;display:flex;align-items:center}
.profile header .lg img{max-height:44px;max-width:180px;width:auto}
.profile header h3{margin:0!important;font-size:17px}
.profile header p{font-size:13px;color:var(--muted);line-height:1.4}
.profile .body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0}
.profile .shots{align-self:start;display:grid;grid-template-columns:1fr auto;gap:8px;padding:16px;background:var(--soft);align-content:start}
.profile .shots img{display:block;border-radius:8px;border:1px solid var(--line);width:100%}
.profile .shots .app{width:92px}
.profile .read{padding:20px 22px;display:grid;gap:14px;align-content:start;font-size:14px;line-height:1.5}
.profile .read p{max-width:none}
.strip{display:flex;height:22px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.strip i{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Colour */
.pal{display:grid;grid-template-columns:minmax(110px,190px) 1fr 96px;gap:16px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.pal .hx{font:400 12px/1 var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.spectrum,.map{border:1px solid var(--line);border-radius:var(--r);padding:12px}
.spectrum svg,.map svg{display:block;width:100%;height:auto}
.map+.prose{margin-top:16px}
.specimen{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.specimen .im{background:var(--soft);display:flex;align-items:center;justify-content:center;min-height:120px}
.specimen .im img{display:block;max-height:200px;width:auto;max-width:100%}
.specimen p{padding:10px 12px;border-top:1px solid var(--line);font-size:12px;line-height:1.45}
.specimen p span{display:block;color:var(--muted)}

/* Conventions and opportunities */
.group{margin-top:44px!important}
.group>h3{margin-top:0!important}
.group>.note{margin-top:6px}
.item{border-top:1px solid var(--line);padding:20px 0;display:grid;gap:10px;max-width:820px}
.item:first-of-type{margin-top:16px}
.item h4{font:600 16px/1.35 var(--sans);letter-spacing:-.005em;text-transform:none;color:var(--ink)}
.item h4 .c{font:400 13px/1 var(--mono);color:var(--muted);margin-left:8px}
.item p{font-size:15px;line-height:1.5;max-width:68ch}
.opp{border:1px solid var(--line);border-radius:var(--r);padding:28px}
.opp+.opp{margin-top:16px}
.opp .k{font:500 12px/1 var(--mono);color:var(--faint)}
.opp h3{margin:10px 0 0!important;font-size:24px;letter-spacing:-.018em}
.opp>p{margin-top:12px;max-width:66ch}
.opp dl{display:grid;grid-template-columns:150px 1fr;gap:0;margin-top:22px;border-top:1px solid var(--line)}
.opp dt,.opp dd{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.opp dt{font:500 11px/1.9 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.opp .ev{margin-top:18px}
.list{padding-left:18px;max-width:68ch}
.list li{margin:6px 0;font-size:15px}
footer{border-top:1px solid var(--line);padding:40px 0 80px;font-size:12px;color:var(--muted)}

@media (max-width:900px){
  section.s{grid-template-columns:1fr;gap:24px;padding:64px 0}
  .rail{position:static}.rail p{max-width:none}
  .profile .body{grid-template-columns:1fr}
  .profile header{grid-template-columns:1fr}
}
@media (max-width:560px){
  .decisions section{grid-template-columns:1fr;gap:10px}
  .wrap{padding:0 18px}.cover{padding:72px 0 48px}.bar b{display:none}
  .findings li{grid-template-columns:1fr;gap:6px}
  .opp{padding:20px}.opp dl{grid-template-columns:1fr}.opp dt{border-bottom:0;padding-bottom:0}
  .pal{grid-template-columns:1fr}
}
@media print{
  .bar{display:none}body{font-size:10pt}.wrap{max-width:none;padding:0 10mm}
  section.s{grid-template-columns:42mm 1fr;gap:8mm;padding:12mm 0}.rail{position:static}
  figure.f,.profile,.opp,.item,.specimen{break-inside:avoid}
}
</style>
</head>
<body>

</body>
</html>
