<meta charset="utf-8">

<title>Type systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<style>
:root{
  --bg:#FFFFFF; --soft:#F6F8FA; --ink:#1A1F36; --text:#3C4257; --muted:#697386; --line:#E3E8EE;
  --accent:#635BFF;
  --ring:0 0 0 1px rgba(60,66,87,.10),0 1px 2px rgba(60,66,87,.08);
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1016; --soft:#161922; --ink:#F3F5F9; --text:#C5CAD8; --muted:#8891A6; --line:#252A38;
  --accent:#938EFF; --ring:0 0 0 1px rgba(255,255,255,.09);
}}
:root[data-theme="dark"]{
  --bg:#0E1016; --soft:#161922; --ink:#F3F5F9; --text:#C5CAD8; --muted:#8891A6; --line:#252A38;
  --accent:#938EFF; --ring:0 0 0 1px rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:1.5rem;line-height:1.25;font-weight:600;letter-spacing:-.018em;color:var(--ink);margin:0 0 8px}
.sub{margin:0 0 22px;color:var(--muted);max-width:64ch}

.words{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 26px;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:10px}
.words .f{display:flex;flex-direction:column;gap:5px;flex:1 1 220px;min-width:0}
.words label{font-size:.75rem;font-weight:500;color:var(--muted)}
.words input{font:inherit;font-size:.8125rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%}
.words input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.words button{font:inherit;font-size:.78rem;font-weight:500;color:var(--muted);background:none;border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}
.words button:hover{color:var(--ink);border-color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{border-radius:12px;box-shadow:var(--ring);overflow:hidden;background:var(--bg);display:flex;flex-direction:column}

/* The specimen. Two surfaces, always both: the headline everyone chooses on,
   and the small row with a number in it where the reader actually lives. */
.sp{background:var(--card-bg);color:var(--card-ink);padding:26px 22px 22px;flex:1}
.sp .disp{font-family:var(--d);font-weight:var(--dw);font-style:var(--ds,normal);font-size:36px;line-height:var(--dl);letter-spacing:var(--dt);font-variation-settings:var(--dv,normal);margin:0 0 12px;word-break:break-word}
.sp .lede{font-family:var(--t);font-weight:400;font-size:14.5px;line-height:1.55;margin:0 0 20px;max-width:32ch;color:var(--card-muted)}
.sp .row{display:flex;align-items:baseline;gap:9px;margin:0 0 7px}
.sp .met{font-family:var(--mf);font-weight:var(--mw);font-size:28px;line-height:1;letter-spacing:-.022em;color:var(--card-ink);font-variant-numeric:tabular-nums lining-nums;font-variation-settings:var(--mv,normal)}
.sp .delta{font-family:var(--t);font-weight:600;font-size:13px;color:var(--card-accent);font-variant-numeric:tabular-nums}
.sp .item{font-family:var(--t);font-weight:400;font-size:13px;line-height:1.45;color:var(--card-muted);font-variant-numeric:tabular-nums}

.nm{display:flex;align-items:baseline;gap:10px;padding:12px 16px 14px;border-top:1px solid var(--line)}
.nm .num{font-family:var(--mono);font-size:.9375rem;font-weight:500;line-height:1;color:var(--muted);opacity:.5;letter-spacing:-.02em;flex:none}
.nm h2{font-size:1rem;font-weight:600;color:var(--ink);margin:0;letter-spacing:-.014em}
.nm .src{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--muted);white-space:nowrap;flex:none}
@media (max-width:640px){.wrap{padding:24px 16px 56px}.sp .disp{font-size:31px}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="t">Type systems</h1>
  <p class="sub" id="sub"></p>

  <div class="words">
    <div class="f"><label for="w1">Your headline</label><input id="w1" type="text" autocomplete="off" spellcheck="false"></div>
    <div class="f"><label for="w2">The line under it</label><input id="w2" type="text" autocomplete="off" spellcheck="false"></div>
    <button type="button" id="reset">Reset</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

  different system, on two surfaces: the 36px headline people choose on,
  and the small row with a number in it where they will actually live.

  Everything you might want to SAY about a system — what it costs, what it
  ships as, how it ages, which licence — is in the JSON below and in
  references/typography.md. Say it in chat. It does not go on this page:
  the moment there is prose next to a specimen, people read instead of look.

  Before showing it:
    1. Put the brand palette into "palette".
    2. Cut "shortlist" to six or eight off the axis ledger, and never put
       two neutral grotesks in the same shortlist — they read as one card
       shown twice and waste a slot.
    3. Set "words" to the company's own headline, or type it into the two
       fields at the top of the page.

  Three sources, loaded per family and only for the shortlist:
    Google Fonts  fonts.googleapis.com/css2   — "fonts"
    Fontshare     api.fontshare.com/v2/css    — "cdn"  (ITF licence, not OFL)
    Fontsource    cdn.jsdelivr.net/fontsource — "cdn"  (self-host route)
====================================================================== -->

<script>
(function(){
  var S={}; try{ S=JSON.parse(document.getElementById('systems').textContent); }catch(e){ return; }
  var P=S.palette||{}, W=S.words||{}, ALL=S.systems||[];
  var list=(S.shortlist&&S.shortlist.length)
    ? S.shortlist.map(function(k){ return ALL.filter(function(s){return s.key===k;})[0]; }).filter(Boolean)
    : ALL;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  // One stylesheet per family, deduped, only for what is on the board — so an
  // unshown system costs nothing and a bad spec breaks one card, not the page.
  var seen={};
  function sheet(href){
    if(seen[href]) return; seen[href]=1;
    var l=document.createElement('link'); l.rel='stylesheet'; l.href=href; document.head.appendChild(l);
  }
  list.forEach(function(s){
    (s.cdn||[]).forEach(sheet);
    Object.keys(s.fonts||{}).forEach(function(fam){
      sheet('https://fonts.googleapis.com/css2?family='+s.fonts[fam]+'&display=swap');
    });
  });

  // Readable text on the accent, so a dark brand colour does not get white on yellow.
  function onAccent(hex){
    var h=String(hex||'#000').replace('#',''); if(h.length===3){h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];}
    var n=parseInt(h,16); if(isNaN(n)) return '#fff';
    var c=[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(function(v){
      return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
    });
    return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])>0.42 ? (P.ink||'#1E1B18') : '#FFFFFF';
  }

  document.getElementById('t').textContent=S.title||'Type systems';
  document.getElementById('sub').textContent=S.sub||'';

  var on=onAccent(P.accent);
  document.getElementById('grid').innerHTML=list.map(function(s,i){
    var c=s.css||{};
    var mf=c.metric==='text' ? c.text : c.display;
    var vars=[
      '--card-bg:'+esc(P.ground||'#FBF9F6'),
      '--card-ink:'+esc(P.ink||'#1E1B18'),
      '--card-muted:'+esc(P.muted||'#6E6459'),
      '--card-accent:'+esc(P.accent||'#1F5D45'),
      '--card-on:'+esc(on),
      '--d:'+esc(c.display), '--t:'+esc(c.text), '--mf:'+esc(mf),
      '--dw:'+(c.dw||600), '--dl:'+(c.dl||1.05), '--dt:'+esc(c.dt||'-0.02em'),
      '--mw:'+(c.mw||600)
    ];
    if(c.ds) vars.push('--ds:'+esc(c.ds));
    if(c.dv) vars.push('--dv:'+esc(c.dv));
    if(c.mv) vars.push('--mv:'+esc(c.mv));

    return '<div class="card" style="'+vars.join(';')+'">'+
      '<div class="sp">'+
        '<p class="disp" data-w="display">'+esc(W.display)+'</p>'+
        '<p class="lede" data-w="lede">'+esc(W.lede)+'</p>'+
        '<div class="row"><span class="met">'+esc(W.metric)+'</span><span class="delta">'+esc(W.delta)+'</span></div>'+
        '<div class="item">'+esc(W.item)+'</div>'+
      '</div>'+
      '<div class="nm"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+
        '<h2>'+esc(s.name)+'</h2><span class="src">'+esc(s.src)+'</span></div>'+
    '</div>';
  }).join('');

  // Their own words. A face chosen on a stranger's headline is chosen on a stranger's brand.
  var i1=document.getElementById('w1'), i2=document.getElementById('w2');
  i1.value=W.display||''; i2.value=W.lede||'';
  function put(which,val){
    var t=val.trim()||W[which]||'';
    [].forEach.call(document.querySelectorAll('[data-w="'+which+'"]'),function(el){ el.textContent=t; });
  }
  i1.addEventListener('input',function(){ put('display',i1.value); });
  i2.addEventListener('input',function(){ put('lede',i2.value); });
  document.getElementById('reset').addEventListener('click',function(){
    i1.value=W.display||''; i2.value=W.lede||''; put('display',i1.value); put('lede',i2.value);
  });
})();
</script>
